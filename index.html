<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notita de 3 meses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
:root{--rose:#8a3a5c;--blush:#fdeef2;--mist:#f7d6e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 15%,#fffafb 0%,var(--blush) 45%,var(--mist) 100%);font-family:'Cormorant Garamond',Georgia,serif;color:var(--rose)}
.text{position:absolute;left:0;right:0;top:7%;text-align:center;padding:0 5%;z-index:2}
.text h1{margin:0;font:400 clamp(44px,9vw,104px)/1.05 'Great Vibes','Snell Roundhand',cursive;text-shadow:0 2px 14px rgba(255,255,255,.9),0 3px 10px rgba(180,80,120,.18)}
.text h1 span{display:block}
.text p{margin:.5em 0 0;font:italic 400 clamp(24px,4.5vw,44px)/1.2 'Cormorant Garamond',Georgia,serif;letter-spacing:.04em}
.fade{opacity:0;filter:blur(8px);transform:translateY(10px);transition:opacity 2.4s ease,filter 2.4s ease,transform 2.4s ease}
.fade.on{opacity:1;filter:none;transform:none}
svg{position:absolute;left:0;bottom:0;width:100%;height:78%}
.stem{fill:none;stroke:#8fae8b;stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 3.5s ease-out}
.go .stem{stroke-dashoffset:0}
.petal{transform:rotate(calc(var(--a)*.1)) scale(.5,.72);transition:transform 4.5s cubic-bezier(.3,.1,.2,1)}
.open .petal{transform:rotate(var(--a)) scale(1)}
.st{opacity:0;transition:opacity 3s ease 2s}
.open .st{opacity:1}
.fl{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(var(--s))}
@media (prefers-reduced-motion:reduce){.petal,.fade,.stem,.st{transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
<body>
<div class="text">
  <h1 class="fade" id="t1"><span>Notita de 3 meses</span><span>de conocernos</span></h1>
  <p class="fade" id="t2">te amo un mundo mi reina ❤️‍🩹</p>
</div>
<svg id="scene" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
  <defs>
    <radialGradient id="pg" cx="0" cy="0" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2a3be"/><stop offset=".35" stop-color="#f9c9d8"/><stop offset="1" stop-color="#fff0f4"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#b0507a" flood-opacity=".28"/></filter>
  </defs>
  <g id="stems"></g>
  <g id="flowers"></g>
</svg>
<script>
const P="M0,0 C-30,-24 -36,-72 0,-102 C36,-72 30,-24 0,0Z";
const ang=[0,120,240,60,180,300];
function lily(){
  let s='<g filter="url(#sh)">';
  ang.forEach((a,i)=>{
    const k=i<3?1:.9;
    s+=`<g class="petal" style="--a:${a}deg;transition-delay:${i*.12}s"><g transform="scale(${k})"><path d="${P}" fill="url(#pg)" stroke="#f0a9c0" stroke-width=".8"/><path d="M0,-6 C-4,-40 -3,-70 0,-92" fill="none" stroke="#e88aab" stroke-opacity=".45" stroke-width="2.5"/><path d="M0,0 C-30,-24 -36,-72 0,-102 C-14,-60 -14,-30 0,0Z" fill="#c9507f" opacity=".07"/></g></g>`;
  });
  s+='</g><g class="st">';
  for(let i=0;i<6;i++){const a=i*60+15,r=a*Math.PI/180,x=Math.sin(r)*42,y=-Math.cos(r)*42;
    s+=`<line x1="0" y1="0" x2="${x}" y2="${y}" stroke="#e7b6a0" stroke-width="1.6"/><ellipse cx="${x}" cy="${y}" rx="3" ry="6" transform="rotate(${a} ${x} ${y})" fill="#e3a07a"/>`;}
  return s+'<circle r="5" fill="#f4d9a5"/></g>';
}
const F=[[180,500,.78,-12],[350,420,.98,8],[520,370,1.18,-4],[700,420,.98,14],[850,500,.78,-8],[435,540,.7,20],[615,545,.72,-18]];
const stems=document.getElementById('stems'),fl=document.getElementById('flowers');
F.forEach(([x,y,s,r],i)=>{
  const sx=500+(x-500)*.35,c=y+(700-y)*.45;
  stems.insertAdjacentHTML('beforeend',`<path class="stem" pathLength="1" style="transition-delay:${i*.2}s" d="M${sx},710 Q${sx+(x-sx)*.1},${c} ${x},${y}"/>`);
  fl.insertAdjacentHTML('beforeend',`<g class="fl" style="--x:${x}px;--y:${y}px;--s:${s};--r:${r}deg">${lily()}</g>`);
});
const sc=document.getElementById('scene'),L=[...document.querySelectorAll('.fl')];
setTimeout(()=>sc.classList.add('go'),300);
L.forEach((g,i)=>setTimeout(()=>g.classList.add('open'),1800+i*900));
setTimeout(()=>t1.classList.add('on'),3200);
setTimeout(()=>t2.classList.add('on'),5600);
</script>
</body>
</html>
